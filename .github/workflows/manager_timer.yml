name: Mets Mystery Manager Daily Drop

on:
  schedule:
    # Runs daily at 11:45 AM Eastern (15:45 UTC)
    - cron: '45 15 * * *'
  workflow_dispatch: # Allows you to trigger it manually anytime

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-with-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas atproto pytz httpx pillow

    - name: Run Lineup Generator
      env:
        BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
        BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
      run: python poster.py

    # --- THE EMAIL ENGINE ---
    - name: Email Story Graphic to Phone
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "Mets Mystery Manager: Today's Story Card"
        to: therallytowel@gmail.com
        from: "Mets Mystery Manager Bot <therallytowel@gmail.com>"
        body: "Here is your daily automated Instagram Story lineup card! Download it to your camera roll and upload directly to your Stories."
        # Grabs whatever story PNG image the python script saved out
        attachments: "*.png"
